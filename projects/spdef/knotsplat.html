<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpDef knot-bundle panel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff"><!-- must track --panel; this page is also openable standalone -->
<!--
  The FIFTH renderer on this page, and the second one that draws gaussians. It plays a KNOT
  BUNDLE: a scene whose motion is stored as the spline field's own knots — a value and a
  tangent per knot — instead of one delta image per frame. Any timestep is a cubic-Hermite
  blend of the two knots bracketing it, evaluated here, per gaussian, every frame.

  Why not a mode of viewer.html
  -----------------------------
  The two formats disagree on everything below the keyframe: four streams per chunk instead of
  two, one image per KNOT instead of per frame, a blend of two knots instead of keyframe-plus-
  delta, and a timeline with no decode frontier because the whole (tiny) knot set is resident.
  viewer.html is what the two published comparisons depend on and its decode path is the one
  CLAUDE.md pins to compression/decoder.py; branching it for a second format is exactly the
  risk that rule exists to prevent. Upstream (web/player_knots/) split for the same reason, and
  this panel is that page's renderer with the chrome removed and the host protocol added.

  What it does NOT carry, unlike viewer.html: the colorize-motion tint, which reads a per-frame
  motion array that does not exist in this format. Hard ellipsoids is shared, because it is a
  property of the splat rather than of how the splat got there. Nor is there a fly camera or a
  virtual pad: this is one object on a turntable, so it orbits (see the camera section).

  The trails ARE here, but they are the mesh card's, not viewer.html's: sampled from the spline
  and striped by knot, so the colour flip marks a knot boundary. viewer.html's overlay reads a
  stored per-frame array and fades blue to red by age, which would say nothing about knot spacing.
  See the trail section.

  Query: ?scene=<url relative to this file>&id=<name echoed back in every message>
         &elev=<opening elevation above the dataset camera, degrees, default 18>
         &zoom=<pull-back multiplier on the opening distance, default 1>
-->
<style>
  :root{color-scheme:light;
        --panel:#ffffff; --ink:#14181d; --muted:#5f6a78; --line:#dde3ea; --accent:#1f5fbf; --err:#b4331f}
  *{box-sizing:border-box}
  html{background:var(--panel)}
  body{margin:0;background:var(--panel);color:var(--ink);overflow:hidden;
       font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #wrap{position:fixed;inset:0}
  #gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  #load{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
        background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.92) 40%);
        font-size:11.5px;color:var(--muted);pointer-events:none}
  #load.hide{display:none}
  #stage{display:block;margin:0 0 5px}
  #track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
  #barfill{height:100%;width:0;background:var(--accent);transition:width .18s linear}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
       padding:20px;text-align:center;font-size:12.5px;color:var(--err)}
  @media(prefers-reduced-motion:reduce){#barfill{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="load"><span id="stage">starting…</span><div id="track"><div id="barfill"></div></div></div>
  <div id="err"></div>
</div>

 vec3 base=vec3(float((cov.w)&0xffu),float((cov.w>>8)&0xffu),float((cov.w>>16)&0xffu))/255.0;float al=float((cov.w>>24)&0xffu)/255.0;
 if(u_hasSH)base=clamp(base+shRest(normalize(wp-u_campos),int(cen.w)),0.0,1.0);

 vPos=a_pos;vec2 c=vec2(p)/p.w;gl_Position=vec4(c+a_pos.x*maj/u_viewport+a_pos.y*mn/u_viewport,0.0,1.0);}`;
const FRAG=`#version 300 es
precision highp float;uniform float u_opacity;uniform int u_hardEdge;uniform float u_hardR;in vec4 vColor;in vec2 vPos;out vec4 frag;
void main(){float d2=dot(vPos,vPos);
 if(u_hardEdge==1){float d=sqrt(d2),aa=max(fwidth(d),1e-4),edge=1.0-smoothstep(u_hardR-aa,u_hardR+aa,d);

const u_shL=gl.getUniformLocation(prog,'u_sh'),u_camposL=gl.getUniformLocation(prog,'u_campos'),u_hasSHL=gl.getUniformLocation(prog,'u_hasSH'),u_shColsL=gl.getUniformLocation(prog,'u_shCols'),u_shBandsL=gl.getUniformLocation(prog,'u_shBands');

const shTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,shTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,1,1,0,gl.RGBA,gl.FLOAT,new Float32Array(4));

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

// ---- knot-striped trails ----------------------------------------------------------------
// The same figure the mesh card draws, on gaussians: each sampled gaussian's path over the
// preceding frames, with the segment colour flipping at every knot. The colour change IS the knot,
// which is the one thing on screen that shows the spacing the paper argues about; a trail in one
// colour would say nothing the moving cloud did not already say.
//
// Sampled from the SPLINE, not from rendered frames: the curve you see is the one the field
// fitted, evaluated between the stored knots exactly as the playhead is. Two colours per `uTint`
// draw call, one per contiguous run of same-interval segments.
const LVERT=`#version 300 es
in vec3 a_p;in float a_age;uniform mat4 u_proj,u_view;out float vAge;
void main(){vAge=a_age;gl_Position=u_proj*u_view*vec4(a_p,1.0);}`;
const LFRAG=`#version 300 es

const lu_proj=gl.getUniformLocation(lprog,'u_proj'),lu_view=gl.getUniformLocation(lprog,'u_view'),
      lu_tint=gl.getUniformLocation(lprog,'u_tint'),lu_alpha=gl.getUniformLocation(lprog,'u_alpha');
const lvao=gl.createVertexArray();gl.bindVertexArray(lvao);
const lbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,lbuf);
const la_p=gl.getAttribLocation(lprog,'a_p'),la_age=gl.getAttribLocation(lprog,'a_age');
gl.enableVertexAttribArray(la_p);gl.vertexAttribPointer(la_p,3,gl.FLOAT,false,16,0);
gl.enableVertexAttribArray(la_age);gl.vertexAttribPointer(la_age,1,gl.FLOAT,false,16,12);
gl.bindVertexArray(null);
// Same two stripe colours as points.html, and for the same reason: far enough apart in hue that a
// change reads as a knot boundary at a glance, and legible on a white panel.
const TRAIL_COLORS=[[0.349,0.698,0.573],[0.980,0.404,0.506]];
// Trailed gaussians, samples per frame, and the cap that bounds a rebuild. The cap is what sets
// the PEAK cost; DETAIL only raises the low end of the length slider.
//
// Deliberately below points.html's 1500 / 5. That card draws a mesh and nothing else, while every
// frame here already costs a full-cloud blend, a splat-texture upload and a depth sort over 23,716
// gaussians, and the trail is rebuilt on top of that whenever the playhead moves. Fewer, sparser
// paths also read better over a dense cloud: 1500 overlapping polylines are a wash, and it is the
// stripe boundaries that have to stay legible rather than any individual path.
//
// No motion filter, unlike the bundle behind knots.html: every gaussian in this scene moves (median
// peak deviation from its own time-mean is 0.216 in a scene 2.5 across, and all of them are above
// 0.01), so a stride over the PLAS-sorted (spatially coherent) rows is already an even sample.
const TRAIL_POINTS=900,DETAIL=4,MAX_TRAIL_SAMPLES=256;

function writeSplat(i,cx,cy,cz,qw,qx,qy,qz,rgba){const o=8*i;texF32[o]=cx;texF32[o+1]=cy;texF32[o+2]=cz;

   baseQuat[4*i],baseQuat[4*i+1],baseQuat[4*i+2],baseQuat[4*i+3],baseColor[i]);}

let ellipOn=false,ellipR=1.0;                 // hard-boundary ellipsoids, radius in std-devs
let trailsOn=true,trailLen=40;                // knot-striped trails, window in frames
let kept=null,trailSamples=null,trailArray=null,trailVerts=0,trailKey='';
const trailRuns=[];

 const v2=view[2],v6=view[6],v10=view[10],v14=view[14];const d=new Int32Array(N);

// ===== orbit camera (world Z up) =====
// Orbit, not fly, and no virtual movement pad — the same argument points.html and field.html make.
// This is one object on a turntable: it sits at the origin, and what you want is to rotate it, pan
// it and get closer, not to walk around a world. That vocabulary is also fully reachable by touch
// (one finger orbits, two pinch and pan), which is the only reason the pad existed on the fly
// panels at all. Lifted verbatim from field.html, whose renderer shares this basis convention:
// r/u/f are the view matrix's COLUMNS with u pointing DOWN the screen (the projection flips Y), so
// the triad is built directly and there is no quaternion anywhere.
//
// The orbit STATE — yaw, pitch, dist AND target, not just the eye — is what goes over the host's
// `cam` relay. A shared eye is not enough to keep two turntables in step: the target and the
// distance are what the pointer handlers actually edit.
const UP=[0,0,1];      // canonical D-NeRF frame: the floor is the xy plane, z is vertical
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};
const _elev=parseFloat(Q.get('elev'));

 else if(m.type==='seek'){gFrame=m.frame;}                     // fractional: this card's clock is continuous
 else if(m.type==='resetView'){cam.yaw=home.yaw;cam.pitch=home.pitch;cam.dist=home.dist;
   cam.target=home.target.slice();needSort=true;}
 else if(m.type==='view'){
   ellipOn=!!m.ellip;ellipR=m.ellipR;
   // Invalidate the trail cache on a change, or a new length shows the previous window until the
   // playhead happens to move. Zero the geometry too, so switching trails OFF takes effect now.
   if(m.trail!==trailsOn||m.trailLen!==trailLen){trailKey='';trailVerts=0;}
   trailsOn=!!m.trail;trailLen=m.trailLen||trailLen;}
 else if(m.type==='stage')stage(m.label,m.pct);
 else if(m.type==='hide')loadEl.classList.add('hide');
 else if(m.type==='keyframe')installKeyframes(m);
 else if(m.type==='knots')installKnots(m);
 else if(m.type==='error')showErr(m.msg);});

let _hello=0;
function hello(){post({type:'hello',scene:SCENE});_hello=setTimeout(hello,600);}

// ===== standalone fallback =====
// knotsplat.html?scene=… on its own still works, which keeps this panel debuggable in isolation
// and is the only place knot_decode.js's own ffmpegReady() is reached. It runs its own clock,
// as points.html's and field.html's fallbacks do.
async function loadStandalone(){
  if(!SCENE){showErr('no ?scene= given');return;}
  const [{parseNpz,buildKeyframe},{ffmpegReady,decodeKnotChunk}]=
    await Promise.all([import('../smv/decode.js'),import('./knot_decode.js')]);
  const base=SCENE.replace(/[^/]*$/,'');
  const grab=async(url,label)=>{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status+' '+url);
    const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let recv=0;
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);recv+=value.length;
      stage(label,total?recv/total*100:null);}
    const out=new Uint8Array(recv);let o=0;for(const c of parts){out.set(c,o);o+=c.length;}return out;};
  stage('loading manifest…',2);
  const scene=await (await fetch(SCENE)).json();
  if(scene.format!=='knot_bundle')throw new Error('not a knot bundle (format='+scene.format+')');
  const built=[];
  for(const c of scene.chunks)
    built.push({kf:buildKeyframe(parseNpz(await grab(base+c.reference,'keyframe…')),null,0),
                start_knot:c.start_knot,end_knot:c.end_knot});
  installKeyframes({totalFrames:scene.num_frames,camera:scene.camera,curve:scene.curve,
                    numIntervals:scene.num_intervals,numKnots:scene.num_knots,chunks:built});
  stage('loading decoder (ffmpeg.wasm, ~31 MB, one-time)…',10);
  const ff=await ffmpegReady(()=>{});
  for(let ci=0;ci<scene.chunks.length;ci++){
    const d=await decodeKnotChunk(ff,scene.chunks[ci],p=>grab(base+p,'knot streams…'),
      (name,done,total)=>stage('decoding '+name+' ('+done+'/'+total+')…',20+70*done/total));
    installKnots({chunk:ci,streams:d.streams,rows:d.rows});
  }
  stage('ready',100);loadEl.classList.add('hide');
  // Standalone there is no host clock, so run one: the same 30 fps the page's cards use.
  let t0=0;requestAnimationFrame(function tick(t){requestAnimationFrame(tick);
    if(!t0){t0=t;return;}gFrame=(gFrame+(t-t0)/1000*30)%totalFrames;t0=t;});
}

if(HOST){stage('waiting for host…',3);hello();}
else loadStandalone().catch(e=>{console.error(e);showErr(e.message||e);});
</script>
