<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpDef comparison panel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f9fc"><!-- must track --panel; this page is also openable standalone -->
<!--
  One panel of the SpDef side-by-side. Deliberately NOT a copy of the SMV viewer: this is the
  render core + eager decode only, driven entirely from outside over postMessage, with no scene
  picker, no stream monitor and no view-option panel of its own.

  Why an iframe per scene rather than one page with two contexts: the SMV renderer keeps its
  scene in module-level vars (N, baseCenter, gops, texture handles). Running two of them means
  either two of every global or a real refactor into a class; a document per panel gives that
  isolation for free, plus its own WebGL context, its own ffmpeg.wasm and its own worker.

  Decode path is imported from ../smv/ — one copy of the ~31 MB ffmpeg core serves both pages.
  ES module specifiers resolve against the importing module, so decode.js still reaches its own
  ./vendor/. See CLAUDE.md before touching the decode math.

  Query: ?scene=<url relative to this file>&id=<name echoed back in every message>
-->
<style>
  :root{color-scheme:light;
        --panel:#f7f9fc; --ink:#14181d; --muted:#5f6a78; --line:#dde3ea; --accent:#1f5fbf; --err:#b4331f}
  *{box-sizing:border-box}
  /* background on html too, not just body — this page is standalone-openable and Safari
     rubber-bands into html's background, not body's. Same rule as every other page here. */
  html{background:var(--panel)}
  body{margin:0;background:var(--panel);color:var(--ink);overflow:hidden;
       font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #wrap{position:fixed;inset:0}
  #gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  /* status overlay — one line + a bar, centered. Sits above the canvas so the keyframe stays
     visible underneath once it lands and only the motion decode is still pending. */
  #load{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
        background:linear-gradient(180deg,rgba(247,249,252,0),rgba(247,249,252,.92) 40%);
        font-size:11.5px;color:var(--muted);pointer-events:none}
  #load.hide{display:none}
  #stage{display:block;margin:0 0 5px}
  #track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
  #barfill{height:100%;width:0;background:var(--accent);transition:width .18s linear}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
       padding:20px;text-align:center;font-size:12.5px;color:var(--err)}
  @media(prefers-reduced-motion:reduce){#barfill{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="load"><span id="stage">starting…</span><div id="track"><div id="barfill"></div></div></div>
  <div id="err"></div>
</div>

const CAM_ELEV=20*Math.PI/180;
function vrot(q,v){const[w,x,y,z]=q,[a,b,c]=v;const ix=w*a+y*c-z*b,iy=w*b+z*a-x*c,iz=w*c+x*b-y*a,iw=-x*a-y*b-z*c;return[ix*w+iw*-x+iy*-z-iz*-y,iy*w+iw*-y+iz*-x-ix*-z,iz*w+iw*-z+ix*-y-iy*-x];}
function qmul(a,b){const[aw,ax,ay,az]=a,[bw,bx,by,bz]=b;return[aw*bw-ax*bx-ay*by-az*bz,aw*bx+ax*bw+ay*bz-az*by,aw*by-ax*bz+ay*bw+az*bx,aw*bz+ax*by-ay*bx+az*bw];}
function qaxis(ax,an){const h=an/2,s=Math.sin(h);return[Math.cos(h),ax[0]*s,ax[1]*s,ax[2]*s];}
function qn(q){const l=Math.hypot(...q)||1;return q.map(v=>v/l);}
function viewMatrix(){const f=vrot(camQ,[0,0,1]),r=vrot(camQ,[1,0,0]),u=vrot(camQ,[0,1,0]);
 const dr=-(r[0]*camPos[0]+r[1]*camPos[1]+r[2]*camPos[2]),du=-(u[0]*camPos[0]+u[1]*camPos[1]+u[2]*camPos[2]),df=-(f[0]*camPos[0]+f[1]*camPos[1]+f[2]*camPos[2]);
 return[r[0],u[0],f[0],0,r[1],u[1],f[1],0,r[2],u[2],f[2],0,dr,du,df,1];}
function projMatrix(w,h,fx,fy){const zn=0.2,zf=500;return[2*fx/w,0,0,0,0,-2*fy/h,0,0,0,0,zf/(zf-zn),1,0,0,-(zf*zn)/(zf-zn),0];}
const keys=new Set();let drag=false,lx=0,ly=0,lookTouchId=null;
canvas.tabIndex=0;canvas.style.outline='none';
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.focus();});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;camQ=qn(qmul(qmul(qaxis(worldUp,-dx*0.003),qaxis(vrot(camQ,[1,0,0]),-dy*0.003)),camQ));});
canvas.addEventListener('wheel',e=>{e.preventDefault();speed*=Math.exp(-e.deltaY*0.001);speed=Math.min(Math.max(speed,radius*0.02),radius*40);},{passive:false});
canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];lookTouchId=t.identifier;drag=true;lx=t.clientX;ly=t.clientY;},{passive:true});
canvas.addEventListener('touchmove',e=>{if(!drag)return;let t=null;for(const c of e.changedTouches)if(c.identifier===lookTouchId){t=c;break;}if(!t)return;const dx=t.clientX-lx,dy=t.clientY-ly;lx=t.clientX;ly=t.clientY;camQ=qn(qmul(qmul(qaxis(worldUp,-dx*0.004),qaxis(vrot(camQ,[1,0,0]),-dy*0.004)),camQ));e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{for(const c of e.changedTouches)if(c.identifier===lookTouchId)drag=false;});
canvas.addEventListener('touchcancel',()=>drag=false);
// keydown is bound inside this document, so WASD only reaches the panel that has focus — the
// other panel follows through the host's camera link, not through its own keyboard.
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','q','e',' '].includes(k))e.preventDefault();keys.add(k);});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{keys.clear();drag=false;});
let lastT=null;
function moveCam(t){if(lastT==null){lastT=t;return;}const dt=Math.min((t-lastT)/1000,0.1);lastT=t;const f=vrot(camQ,[0,0,1]),r=vrot(camQ,[1,0,0]);let mv=[0,0,0];const add=(v,s)=>{mv[0]+=v[0]*s;mv[1]+=v[1]*s;mv[2]+=v[2]*s;};
 if(keys.has('w'))add(f,1);if(keys.has('s'))add(f,-1);if(keys.has('d'))add(r,1);if(keys.has('a'))add(r,-1);if(keys.has('e')||keys.has(' '))add(worldUp,-1);if(keys.has('q')||keys.has('control'))add(worldUp,1);
 const len=Math.hypot(...mv);if(len>0){const s=speed*(keys.has('shift')?4:1)*dt/len;camPos=[camPos[0]+mv[0]*s,camPos[1]+mv[1]*s,camPos[2]+mv[2]*s];}}
// Camera link. Echo suppression is by construction: applying a remote pose also updates the
// last-sent snapshot, so the next diff finds nothing and no message bounces back.
let _sent=null,_remote=null;
const _camState=()=>camPos.concat(camQ,[speed]);
function emitCamIfMoved(){const s=_camState();
 if(_sent){let same=true;for(let i=0;i<8;i++)if(Math.abs(s[i]-_sent[i])>1e-7){same=false;break;}if(same)return;}
 _sent=s;post({type:'cam',pos:camPos.slice(),quat:camQ.slice(),speed});}
function applyCam(m){_remote=m;camPos=m.pos.slice();camQ=m.quat.slice();if(m.speed)speed=m.speed;_sent=_camState();}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(wrap.clientWidth*dpr));canvas.height=Math.max(1,Math.floor(wrap.clientHeight*dpr));}
addEventListener('resize',resize);

// ===== timeline =====
let gops=[],activeGop=-1,totalFrames=1,gFrame=0,camMeta=null,started=false;
let builtFrame=-1,curView=null,curVw=1,curVh=1,curVx=0,curVy=0,curFx=1,curFy=1,lastView=null,fps=0,fpsN=0,fpsT=0;
function activateGop(gi){const g=gops[gi],k=g.kf;baseCenter=k.center;baseScale=k.scale;baseQuat=k.quat;baseColor=k.color;
 N=k.numTotal;staticIdx=k.staticIdx;numDyn=k.numDyn;numFrames=g.F;motion=g.motion;activeGop=gi;
 shIdx=k.shIndex||null;uploadSH(k.shCodebook||null);buildTexture();uploadTexture();}
function covering(gf){const out=[];for(let g=0;g<gops.length;g++)if(gops[g].start<=gf&&gf<gops[g].end)out.push(g);return out;}
// Frontier of contiguously-decoded motion; the host holds playback at the min across panels.
function decodedEnd(){let e=0;for(let i=0;i<gops.length;i++){if(!gops[i].motion)break;e=gops[i].end;}return e;}
function drawSplats(op){gl.useProgram(prog);gl.bindVertexArray(vao);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(u_texL,0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,shTex);gl.uniform1i(u_shL,1);gl.uniform3fv(u_camposL,camPos);gl.uniform1i(u_hasSHL,(shHas&&shBands>0)?1:0);gl.uniform1i(u_shColsL,shCols);gl.uniform1i(u_shBandsL,shBands);
 gl.uniformMatrix4fv(u_proj,false,projMatrix(curVw,curVh,curFx,curFy));gl.uniformMatrix4fv(u_view,false,curView);gl.uniform2f(u_focal,curFx,curFy);gl.uniform2f(u_viewport,curVw,curVh);gl.uniform1f(u_op,op);
 gl.uniform1i(u_hardEdgeL,ellipOn?1:0);gl.uniform1f(u_hardRL,ellipR);
 const nw=camMeta?camMeta.width:curVw,k=curVw/nw;gl.uniform1f(u_lowpassL,1.2*k*k);
 gl.drawArraysInstanced(gl.TRIANGLE_FAN,0,4,N);gl.activeTexture(gl.TEXTURE0);}
// Line segments for a sample of dynamic gaussians over the trailing window of the active GOP.
// Position at local frame L = keyframe (L==0) or motion[L-1]; clamped to the GOP, so a trail
// longer than the elapsed frames simply starts at the GOP's keyframe.
function buildTraj(){trajVerts=0;
 if(!trajOn||activeGop<0||!motion||numDyn<=0)return;
 const g=gops[activeGop],localO=gFrame-g.start;if(localO<=0)return;          // keyframe → no trail
 const lo=Math.max(0,localO-trajTrail),segs=localO-lo;if(segs<1)return;      // need ≥1 segment
 const stride=Math.max(1,(numDyn/trajCount)|0);let nPts=0;for(let j=0;j<numDyn;j+=stride)nPts++;
 const nVerts=nPts*segs*2;if(!trajArr||trajArr.length<nVerts*4)trajArr=new Float32Array(nVerts*4);
 const posAt=(j,L,out)=>{const gi=staticIdx+j;
   if(L===0){out[0]=baseCenter[gi*3];out[1]=baseCenter[gi*3+1];out[2]=baseCenter[gi*3+2];}
   else{const b=(Math.min(L,numFrames)-1)*numDyn*7+j*7;out[0]=motion[b];out[1]=motion[b+1];out[2]=motion[b+2];}};
 const p0=[0,0,0],p1=[0,0,0];let o=0;
 for(let j=0;j<numDyn;j+=stride){
   for(let s=0;s<segs;s++){const t=segs>1?s/(segs-1):1;posAt(j,lo+s,p0);posAt(j,lo+s+1,p1);
     trajArr[o++]=p0[0];trajArr[o++]=p0[1];trajArr[o++]=p0[2];trajArr[o++]=t;
     trajArr[o++]=p1[0];trajArr[o++]=p1[1];trajArr[o++]=p1[2];trajArr[o++]=t;}}
 trajVerts=nVerts;
 gl.bindBuffer(gl.ARRAY_BUFFER,tbuf);gl.bufferData(gl.ARRAY_BUFFER,trajArr.subarray(0,nVerts*4),gl.DYNAMIC_DRAW);}
function drawTraj(){if(!trajVerts)return;
 gl.viewport(curVx,curVy,curVw,curVh);gl.useProgram(tprog);gl.bindVertexArray(tvao);
 gl.uniformMatrix4fv(tu_proj,false,projMatrix(curVw,curVh,curFx,curFy));gl.uniformMatrix4fv(tu_view,false,curView);gl.uniform1f(tu_alpha,trajAlpha);
 gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.drawArrays(gl.LINES,0,trajVerts);
 gl.blendFuncSeparate(gl.ONE_MINUS_DST_ALPHA,gl.ONE,gl.ONE_MINUS_DST_ALPHA,gl.ONE);gl.bindVertexArray(vao);}
function frame(t){requestAnimationFrame(frame);moveCam(t);
 if(!N||!gops.length)return;
 emitCamIfMoved();
 fpsN++;if(t-fpsT>1000){fps=Math.round(fpsN*1000/(t-fpsT));fpsN=0;fpsT=t;post({type:'stats',fps,splats:N});}
 let vw=canvas.width,vh=canvas.height,vx=0,vy=0,fx,fy;
 if(camMeta){const asp=camMeta.width/camMeta.height;   // letterbox to the dataset camera's aspect
   if(canvas.width/canvas.height>asp){vh=canvas.height;vw=Math.round(vh*asp);}else{vw=canvas.width;vh=Math.round(vw/asp);}
   vx=(canvas.width-vw)>>1;vy=(canvas.height-vh)>>1;fy=0.5*vh/Math.tan(camMeta.fovy/2);fx=0.5*vw/Math.tan(camMeta.fovx/2);
 }else{fy=0.5*canvas.height/Math.tan(0.5*1.1);fx=fy;}
 curVw=vw;curVh=vh;curVx=vx;curVy=vy;curFx=fx;curFy=fy;curView=viewMatrix();
 let moved=!lastView;if(lastView)for(let i=0;i<16;i++)if(Math.abs(curView[i]-lastView[i])>1e-6)moved=true;lastView=curView.slice();
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.viewport(vx,vy,vw,vh);
 const cov=covering(gFrame);
 const owner=cov.length?cov[0]:Math.min(Math.floor(gFrame/Math.max(1,(gops[0].end-gops[0].start))),gops.length-1);
 const mi=gFrame-gops[owner].start-1;
 if(activeGop!==owner||builtFrame!==gFrame){if(activeGop!==owner)activateGop(owner);
   if(mi<0||!motion)applyKeyframe();else applyFrame(Math.min(mi,numFrames-1));builtFrame=gFrame;needSort=true;}
 if(moved||needSort){sortSplats(curView);needSort=false;}
 drawSplats(1.0);
 // trajectory overlay — rebuild only when the frame or its settings change, then draw over the splats
 if(trajOn){const k=activeGop+'|'+gFrame+'|'+trajCount+'|'+trajTrail;if(k!==trajKey){trajKey=k;buildTraj();}drawTraj();}}
function frameScene(){
 // Real held-out test camera: use its pose verbatim in the renderer's [0,-1,0]-up world. The SMV
 // viewer additionally PCA-aligns navigation for D-NeRF; NOT done here on purpose — PCA is
 // computed per point cloud, so the two panels would end up with different world-up axes and
 // the side-by-side would no longer be the same view of the same thing.
 let cx=0,cy=0,cz=0;for(let i=0;i<N;i++){cx+=baseCenter[3*i];cy+=baseCenter[3*i+1];cz+=baseCenter[3*i+2];}cx/=N;cy/=N;cz/=N;
 const ds=[];for(let i=0;i<N;i+=10)ds.push(Math.hypot(baseCenter[3*i]-cx,baseCenter[3*i+1]-cy,baseCenter[3*i+2]-cz));ds.sort((a,b)=>a-b);
 radius=ds[Math.floor(ds.length*0.9)]||10;speed=radius*0.3;
 if(camMeta){camPos=camMeta.campos.slice();camQ=camMeta.camquat.slice();
   // Nav axis comes from the dataset camera, NOT the renderer's hardcoded [0,-1,0]. D-NeRF's world
   // frame is Z-up, so that default sits ~81 deg off here and only 0.25 off the view direction:
   // Q/E dollied in and out instead of rising, and drag-yaw tumbled about a near-forward axis.
   // (The SMV viewer fixes this with PCA nav-alignment for D-NeRF; PCA is per point cloud, so the
   // two panels would disagree — see the note above. The test camera is shared and identical by
   // construction, so it is the one frame both panels can agree on.)
   // Derived from camMeta, not the live camQ: this is a fixed scene axis, not a follow-cam.
   // Screen-up is -worldUp (moveCam adds -1 for E), hence the negation.
   const u=vrot(camMeta.camquat,[0,1,0]),l=Math.hypot(u[0],u[1],u[2])||1;
   worldUp[0]=-u[0]/l;worldUp[1]=-u[1]/l;worldUp[2]=-u[2]/l;
   // Raise the opening viewpoint. Orbit about the WORLD ORIGIN, rotating position and orientation
   // by the same amount about the camera's right axis: distance is preserved and the scene stays
   // centred, because the D-NeRF test camera aims at the origin to ~1e-8. Origin rather than the
   // point-cloud centroid on purpose — the two scenes' centroids differ, and both panels have to
   // resolve to an identical camera. worldUp above is read off the UNROTATED camera, so it stays
   // the scene's up rather than the tilted one.
   // NEGATED: camera-Y is screen-DOWN (that is exactly why worldUp negates it above), so rotating
   // toward the camera's own +Y axis lowers the viewpoint. Positive CAM_ELEV must raise it.
   if(CAM_ELEV){const q=qaxis(vrot(camQ,[1,0,0]),-CAM_ELEV);camPos=vrot(q,camPos);camQ=qn(qmul(q,camQ));}}
 else{worldUp[0]=0;worldUp[1]=-1;worldUp[2]=0;camPos=[cx,cy,cz-1.6*radius];camQ=[1,0,0,0];}
 _sent=null;}

// ===== scene install =====
// Hosted, this panel never instantiates wasm at all. Motion decode is one-shot preprocessing —
// once offsets are dequantised into the motion array nothing downstream touches the decoder, and
// the renderer below is pure WebGL — so there is no reason for a decoder to live per canvas. The
// host decodes BOTH scenes on one ffmpeg.wasm and pushes finished arrays here. Keyframes arrive
// first (no decoder needed for those), so both panels are orbitable while motion is still decoding.
function installKeyframes(m){
  clearTimeout(_hello);
  totalFrames=m.totalFrames;camMeta=m.camera||null;
  gops=m.gops.map(g=>({kf:g.kf,motion:null,F:0,start:g.start,end:g.end,gop_id:g.gop_id}));
  // frameScene() resets to this scene's own camera, which would clobber a pose the other panel
  // already sent while this one was still loading. Re-apply that pose if there was one.
  activateGop(0);frameScene();if(_remote)applyCam(_remote);emitCamIfMoved();builtFrame=-1;needSort=true;
  resize();if(!started){started=true;requestAnimationFrame(frame);}
  post({type:'ready',frames:totalFrames,splats:N});}
function installMotion(m){const g=gops[m.gop];if(!g)return;
  g.motion=m.motion;g.F=m.F;
  if(activeGop===m.gop){motion=g.motion;numFrames=g.F;builtFrame=-1;}
  // `gop` doubles as the delivery ACK: the host holds its own copy until this arrives, so a panel
  // that has to be reloaded can still be served.
  post({type:'buffered',end:decodedEnd(),gop:m.gop});}

addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data;
 if(!m||m.ch!=='spdef'||m.to!==ID)return;
 if(m.type==='cam')applyCam(m);
 else if(m.type==='seek'){gFrame=((m.frame%totalFrames)+totalFrames)%totalFrames;builtFrame=-1;needSort=true;}
 else if(m.type==='resetView')frameScene();
 else if(m.type==='view'){
   // Host sends the whole option set every time, so this stays idempotent. Both invalidations
   // matter: trajKey caches the built trail, builtFrame caches the written splat colours — a
   // changed option that doesn't also bump the frame would otherwise show the previous state.
   ellipOn=!!m.ellip;ellipR=m.ellipR;
   if(m.traj!==trajOn||m.trajCount!==trajCount||m.trajTrail!==trajTrail){trajKey='';trajVerts=0;}
   trajOn=!!m.traj;trajCount=m.trajCount;trajTrail=m.trajTrail;
   if(m.offCol!==offsetColorOn||m.offMix!==offsetColorMix)builtFrame=-1;
   offsetColorOn=!!m.offCol;offsetColorMix=m.offMix;}
 else if(m.type==='stage')stage(m.label,m.pct);                // host narrates its own loading
 else if(m.type==='hide')loadEl.classList.add('hide');
 else if(m.type==='keyframe')installKeyframes(m);
 else if(m.type==='motion')installMotion(m);
 else if(m.type==='error')showErr(m.msg);});

// Announce until the host answers. This panel's module script could in principle run before the
// host page has attached its listener, and a single dropped hello would strand the panel.
let _hello=0;
function hello(){post({type:'hello',scene:SCENE});_hello=setTimeout(hello,600);}

// ===== standalone fallback =====
// viewer.html?scene=… opened on its own still works, which keeps one panel debuggable in
// isolation. Imported dynamically so a hosted panel never even fetches the decode path.
async function loadStandalone(){
  if(!SCENE){showErr('no ?scene= given');return;}
  const [{parseNpz,decodeShared,buildKeyframe},{ffmpegReady,decodeMotionGopBundle,disposeFFmpeg}]=
    await Promise.all([import('../smv/decode.js'),import('../smv/decode_motion.js')]);
  const base=SCENE.replace(/[^/]*$/,'');
  const grab=async(url,label)=>{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status+' '+url);
    const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),chunks=[];let recv=0;
    for(;;){const{done,value}=await rd.read();if(done)break;chunks.push(value);recv+=value.length;
      stage(label,total?recv/total*100:null);}
    const out=new Uint8Array(recv);let o=0;for(const c of chunks){out.set(c,o);o+=c.length;}return out;};
  stage('loading manifest…',2);
  const scene=await (await fetch(SCENE)).json();
  let shared=null;
  if(scene.has_shared_statics&&scene.shared_statics_path)
    shared=decodeShared(parseNpz(await grab(base+scene.shared_statics_path,'shared statics…')));
  const built=[];
  for(const g of scene.gops)
    built.push({kf:buildKeyframe(parseNpz(await grab(base+g.reference_path,'keyframe…')),shared,g.num_shared_statics||0),
                start:g.start_frame,end:g.end_frame,gop_id:g.gop_id});
  installKeyframes({totalFrames:scene.num_frames,camera:scene.camera,gops:built});
  stage('loading decoder (ffmpeg.wasm, ~31 MB, one-time)…',10);
  const ff=await ffmpegReady(()=>{});
  for(let gi=0;gi<scene.gops.length;gi++){
    const g=scene.gops[gi];
    const streams={xyz:{bytes:await grab(base+g.streams.xyz.path,`motion ${gi+1} — xyz…`),meta:g.streams.xyz.meta},
                   rot:{bytes:await grab(base+g.streams.rot.path,`motion ${gi+1} — rot…`),meta:g.streams.rot.meta}};
    stage(`decoding motion ${gi+1}/${scene.gops.length}…`,60);
    const r=await decodeMotionGopBundle(ff,streams,built[gi].kf);
    installMotion({gop:gi,motion:r.motion,F:r.F});
    await new Promise(res=>requestAnimationFrame(res));
  }
  await disposeFFmpeg();                       // decode is done for good — hand the wasm heaps back
  stage('ready',100);loadEl.classList.add('hide');
}

if(HOST){stage('waiting for host…',3);hello();}
else loadStandalone().catch(e=>{console.error(e);showErr(e.message||e);});
</script>
