<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpDef field panel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff"><!-- must track --panel; this page is also openable standalone -->
<!--
  The "field in place" panel of the SpDef page: the canonical gaussians and the deformation field's
  three tri-planes in one scene, sharing one coordinate frame.

  A THIRD renderer, deliberately. The core (EWA splatting, the 16-bit depth bucketing) is lifted
  from viewer.html, but this panel carries a shader branch the comparison panels must never grow —
  plane cells whose colour is evaluated on the GPU from the tri-plane atlas and six time uniforms —
  and viewer.html is what the two published comparisons depend on.

  What is on screen, and why it is built this way:

  - SHEET CELLS ARE GAUSSIANS, not textured quads, so sheets and cloud go through ONE sorted splat
    pass and occlude each other correctly. Below u_planeStart a splat is a canonical gaussian with
    its own colour (plus SH); at or above it, cen.w is a packed (plane, cellX, cellY) reference.
  - ALIGNMENT IS BY CONSTRUCTION. Cells sit on the faces of the field's OWN aabb (from the
    checkpoint, carried in meta.json), addressed by the same lo + (hi-lo)*i/(n-1) mapping the field
    reads them with. Nothing is fitted or re-centred. Checked offline by re-rendering the scene in
    numpy: each sheet's occupied cells are the cloud's shadow on that face.
  - ONE VIEW: the plane at time t, G(t) = base + Σ_r w_r(t)·res_r, PCA-projected in the `composed`
    basis. This is a teaching figure; the magnitude maps, the template and the per-residual planes
    live in triplanes.html. So only the three composed_* atlases and the occupancy maps are
    fetched, and scrubbing time costs six uniforms — no upload, no CPU compositing.
  - Cells below the bundle's occupancy threshold are not emitted at all, and the rest carry
    occupancy as alpha: the sheets fade out exactly where the field stops being supervised.
  - HARD ELLIPSOIDS apply to the CLOUD ONLY. The same control the two comparison cards carry, but
    here one draw call holds both kinds of splat, so the fragment shader is told which it is by a
    flat varying rather than by a global uniform — hard-edging the sheet cells would turn a
    continuous feature image into a grid of discs with gaps between them.
  - CAST LINES are the lookup itself, drawn. A canonical gaussian's feature is read at its
    perpendicular projection onto each of the three planes, so a segment from its centre to each
    face is exactly the address it queries; the sheet's colour where the segment lands is the value
    it gets back. They follow the sheet toggles (a hidden plane is not queried on screen either),
    fade out at the cloud end so they do not smother the thing they come from, and are drawn over
    the splats as an overlay, the same convention as the trajectory overlay in viewer.html. This is
    also the one reason a line program is back after the bounding box took the old one with it.
  - ORBIT, not fly, and no virtual movement pad — the same reasoning as points.html. One object on
    a turntable needs orbit/pan/dolly, and unlike a fly camera that vocabulary is fully reachable
    by touch, which is what the pad exists to work around.
  - alpha:true + premultipliedAlpha:true, cleared to (0,0,0,0). The splat blend is a front-to-back
    `under` operator (ONE_MINUS_DST_ALPHA, ONE); clearing to opaque white would leave DST_ALPHA at
    1 and multiply every splat by zero — a blank canvas.

  Both shaders are checked with glslangValidator (#version 300 es) after every edit; a shader error
  blanks the panel and nothing else on this site catches it.

  Query: ?scene=<canonical scene.json>&tri=<triplane bundle dir>&id=<name echoed in every message>
         [&elev=<deg>&zoom=<factor>]   opening pose; the sheets sit on a box wider than the cloud
-->
<style>
  :root{color-scheme:light;
        --panel:#ffffff; --ink:#14181d; --muted:#5f6a78; --line:#dde3ea; --accent:#1f5fbf; --err:#b4331f}
  *{box-sizing:border-box}
  /* background on html too, not just body — this page is standalone-openable and Safari
     rubber-bands into html's background, not body's. Same rule as every other page here. */
  html{background:var(--panel)}
  body{margin:0;background:var(--panel);color:var(--ink);overflow:hidden;
       font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  #wrap{position:fixed;inset:0}
  /* touch-action:none so a one-finger orbit and a two-finger pinch reach the canvas instead of
     scrolling the host page out from under them */
  #gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  #load{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
        background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.92) 40%);
        font-size:11.5px;color:var(--muted);pointer-events:none}
  #load.hide{display:none}
  #stage{display:block;margin:0 0 5px}
  #track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
  #barfill{height:100%;width:0;background:var(--accent);transition:width .18s linear}
  #hud{position:absolute;left:10px;bottom:9px;margin:0;padding:3px 8px;border-radius:7px;
       background:rgba(255,255,255,.86);border:1px solid var(--line);
       font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
       pointer-events:none;display:none}
  #hud.on{display:block}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
       padding:20px;text-align:center;font-size:12.5px;color:var(--err)}
  @media(prefers-reduced-motion:reduce){#barfill{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="load"><span id="stage">starting…</span><div id="track"><div id="barfill"></div></div></div>
  <p id="hud"></p>
  <div id="err"></div>
</div>

<script type="module">
const Q=new URLSearchParams(location.search);
const ID=Q.get('id')||'field';
const SCENE=Q.get('scene')||'scenes/bouncingballs_canonical/scene.json';
const TRI=(Q.get('tri')||'triplanes/bouncingballs/').replace(/\/?$/,'/');
// One view only: the plane at time t in the `composed` basis, fitted to the planes themselves.
const BASIS='composed';
const $=id=>document.getElementById(id);
const canvas=$('gl'),loadEl=$('load'),stageEl=$('stage'),barEl=$('barfill'),errEl=$('err'),hudEl=$('hud');

// ===== host protocol =====
// Same {ch:'spdef'} envelope as viewer.html and points.html — `id` panel->host, `to` host->panel.
const HOST=parent!==window;
function post(m){if(HOST)parent.postMessage(Object.assign({ch:'spdef',id:ID},m),location.origin);}
function stage(label,pct){stageEl.textContent=label;if(pct!=null)barEl.style.width=Math.max(0,Math.min(100,pct))+'%';
  post({type:'progress',label,pct});}
function showErr(m){errEl.textContent='✗ '+m;errEl.style.display='flex';loadEl.classList.add('hide');
  post({type:'error',msg:String(m)});}

const gl=canvas.getContext('webgl2',{antialias:false,premultipliedAlpha:true,alpha:true});
if(!gl){showErr('WebGL2 unavailable');throw 0;}

// ===== shaders =====
const VERT=`#version 300 es
precision highp float;precision highp int;
uniform highp usampler2D u_tex;uniform highp sampler2D u_sh;uniform highp sampler2D u_coef;
uniform mat4 u_proj,u_view;uniform vec2 u_focal,u_viewport;uniform vec3 u_campos;uniform bool u_hasSH;uniform float u_lowpass;
uniform int u_shCols;uniform int u_shBands;
uniform uint u_planeStart;uniform ivec2 u_res;
uniform float u_w[6];
uniform vec3 u_lo[3],u_hi[3];uniform float u_show[3],u_sheetAlpha,u_cloudAlpha;
uniform bool u_hard;   // hard-edged ellipsoids, CLOUD ONLY — the sheet cells stay soft, or the
                       // feature image becomes a grid of discs with holes between them
in vec2 a_pos;in uint a_index;out vec4 vColor;out vec2 vPos;flat out float vHard;
vec3 shRest(vec3 d,int e){float x=d.x,y=d.y,z=d.z,xx=x*x,yy=y*y,zz=z*z,xy=x*y,yz=y*z,xz=x*z;vec3 r=vec3(0.0);
 int row=e/u_shCols, b=(e-row*u_shCols)*15;
 r+=-0.4886025119*y*texelFetch(u_sh,ivec2(b+0,row),0).rgb; r+=0.4886025119*z*texelFetch(u_sh,ivec2(b+1,row),0).rgb; r+=-0.4886025119*x*texelFetch(u_sh,ivec2(b+2,row),0).rgb;
 if(u_shBands<=3) return r;
 r+=1.0925484306*xy*texelFetch(u_sh,ivec2(b+3,row),0).rgb; r+=-1.0925484306*yz*texelFetch(u_sh,ivec2(b+4,row),0).rgb; r+=0.3153915653*(2.0*zz-xx-yy)*texelFetch(u_sh,ivec2(b+5,row),0).rgb;
 r+=-1.0925484306*xz*texelFetch(u_sh,ivec2(b+6,row),0).rgb; r+=0.5462742153*(xx-yy)*texelFetch(u_sh,ivec2(b+7,row),0).rgb;
 if(u_shBands<=8) return r;
 r+=-0.5900435899*y*(3.0*xx-yy)*texelFetch(u_sh,ivec2(b+8,row),0).rgb; r+=2.8906114426*xy*z*texelFetch(u_sh,ivec2(b+9,row),0).rgb; r+=-0.4570457995*y*(4.0*zz-xx-yy)*texelFetch(u_sh,ivec2(b+10,row),0).rgb;
 r+=0.3731763326*z*(2.0*zz-3.0*xx-3.0*yy)*texelFetch(u_sh,ivec2(b+11,row),0).rgb; r+=-0.4570457995*x*(4.0*zz-xx-yy)*texelFetch(u_sh,ivec2(b+12,row),0).rgb; r+=1.4453057213*z*(xx-yy)*texelFetch(u_sh,ivec2(b+13,row),0).rgb; r+=-0.5900435899*x*(xx-3.0*yy)*texelFetch(u_sh,ivec2(b+14,row),0).rgb;
 return r;}
void main(){vHard=0.0;   // written before every early return; the flat varying is what splits the
                         // two kinds of splat inside one draw call
 uint i=a_index;uvec4 cen=texelFetch(u_tex,ivec2((i&0x3ffu)<<1,i>>10),0);vec3 wp=uintBitsToFloat(cen.xyz);
 vec4 cam=u_view*vec4(wp,1.0);vec4 p=u_proj*cam;float clip=1.2*p.w;
 if(p.z<-clip||p.x<-clip||p.x>clip||p.y<-clip||p.y>clip){gl_Position=vec4(0.,0.,2.,1.);return;}
 uvec4 cov=texelFetch(u_tex,ivec2(((i&0x3ffu)<<1)|1u,i>>10),0);vec2 u1=unpackHalf2x16(cov.x),u2=unpackHalf2x16(cov.y),u3=unpackHalf2x16(cov.z);
 mat3 Vrk=mat3(u1.x,u1.y,u2.x,u1.y,u2.y,u3.x,u2.x,u3.x,u3.y);
 mat3 J=mat3(u_focal.x/cam.z,0.,-(u_focal.x*cam.x)/(cam.z*cam.z),0.,-u_focal.y/cam.z,(u_focal.y*cam.y)/(cam.z*cam.z),0.,0.,0.);
 mat3 T=transpose(mat3(u_view))*J;mat3 cov2d=transpose(T)*Vrk*T;
 cov2d[0][0]+=u_lowpass;cov2d[1][1]+=u_lowpass;
 float mid=(cov2d[0][0]+cov2d[1][1])/2.0;
 float rad=length(vec2((cov2d[0][0]-cov2d[1][1])/2.0,cov2d[0][1]));float l1=mid+rad,l2=mid-rad;if(l2<0.0)return;
 vec2 dv=normalize(vec2(cov2d[0][1],l1-cov2d[0][0]));vec2 maj=min(sqrt(2.0*l1),1024.0)*dv;vec2 mn=min(sqrt(2.0*l2),1024.0)*vec2(dv.y,-dv.x);
 vec3 base;float al;
 if(i<u_planeStart){
   base=vec3(float((cov.w)&0xffu),float((cov.w>>8)&0xffu),float((cov.w>>16)&0xffu))/255.0;
   al=float((cov.w>>24)&0xffu)/255.0*u_cloudAlpha;
   if(u_hasSH)base=clamp(base+shRest(normalize(wp-u_campos),int(cen.w)),0.0,1.0);
   vHard=u_hard?1.0:0.0;
 }else{
   // cen.w = plane<<28 | cellX<<14 | cellY; the atlas is tiles across, planes down.
   // The plane at time t: base + Σ_r w_r(t)·res_r, already PCA-projected to three components, so
   // the whole time axis is these seven fetches and six uniforms.
   int pl=int(cen.w>>28),cx=int((cen.w>>14)&0x3fffu),cy=int(cen.w&0x3fffu),row=pl*u_res.y+cy;
   vec3 v=texelFetch(u_coef,ivec2(cx,row),0).rgb;
   for(int r=0;r<6;r++)v+=u_w[r]*texelFetch(u_coef,ivec2((r+1)*u_res.x+cx,row),0).rgb;
   base=clamp((v-u_lo[pl])/(u_hi[pl]-u_lo[pl]),0.0,1.0);
   al=float((cov.w>>24)&0xffu)/255.0*u_sheetAlpha*u_show[pl];
 }
 if(al<=0.002){gl_Position=vec4(0.,0.,2.,1.);return;}
 vColor=clamp(p.z/p.w+1.0,0.0,1.0)*vec4(base,al);
 vPos=a_pos;vec2 c=vec2(p)/p.w;gl_Position=vec4(c+a_pos.x*maj/u_viewport+a_pos.y*mn/u_viewport,0.0,1.0);}`;
const FRAG=`#version 300 es
precision highp float;uniform float u_opacity;uniform float u_hardR;in vec4 vColor;in vec2 vPos;flat in float vHard;out vec4 frag;
void main(){float d2=dot(vPos,vPos);
 if(vHard>0.5){ // hard-boundary ellipsoid: solid fill out to u_hardR std-devs (1px AA), exposes point-based structure
  float d=sqrt(d2),aa=max(fwidth(d),1e-4),edge=1.0-smoothstep(u_hardR-aa,u_hardR+aa,d);
  if(edge<=0.0)discard;float B=vColor.a*u_opacity*edge;frag=vec4(B*vColor.rgb,B);return;}
 float A=-d2;if(A<-4.0)discard;float B=exp(A)*vColor.a*u_opacity;frag=vec4(B*vColor.rgb,B);}`;

// The cast-line overlay: one segment per sampled gaussian per plane, from the centre to the foot of
// its perpendicular on that face — the address the field is queried at. `a_end` is 0 at the centre
// and 1 at the plane, and the alpha ramps along it: the cloud end is the crowded end, and the plane
// end is the one carrying the answer. `u_show` is the same per-plane visibility the sheets use, so a
// hidden plane drops its lines too, and the colour is the gaussian's own (darkened, since this panel
// composites over white) so a segment can be traced back to the ball it came from.
const LVERT=`#version 300 es
precision highp float;uniform mat4 u_proj,u_view;uniform float u_show[3];uniform float u_alpha;
in vec3 a_p;in vec3 a_col;in float a_end;in float a_plane;out vec4 vC;
void main(){vC=vec4(a_col*0.62,u_alpha*u_show[int(a_plane)]*mix(0.18,1.0,a_end));
 gl_Position=u_proj*u_view*vec4(a_p,1.0);}`;
const LFRAG=`#version 300 es
precision highp float;in vec4 vC;out vec4 o;
void main(){if(vC.a<=0.004)discard;o=vC;}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const prog=(()=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;})();
const U=n=>gl.getUniformLocation(prog,n);
const u_proj=U('u_proj'),u_view=U('u_view'),u_focal=U('u_focal'),u_viewport=U('u_viewport'),u_op=U('u_opacity'),
      u_texL=U('u_tex'),u_lowpassL=U('u_lowpass'),u_shL=U('u_sh'),u_camposL=U('u_campos'),u_hasSHL=U('u_hasSH'),
      u_shColsL=U('u_shCols'),u_shBandsL=U('u_shBands'),u_coefL=U('u_coef'),
      u_planeStartL=U('u_planeStart'),u_resL=U('u_res'),u_wL=U('u_w[0]'),
      u_loL=U('u_lo[0]'),u_hiL=U('u_hi[0]'),
      u_showL=U('u_show[0]'),u_sheetAlphaL=U('u_sheetAlpha'),u_cloudAlphaL=U('u_cloudAlpha'),
      u_hardL=U('u_hard'),u_hardRL=U('u_hardR');
const lprog=(()=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,LVERT));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,LFRAG));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;})();
const lu_proj=gl.getUniformLocation(lprog,'u_proj'),lu_view=gl.getUniformLocation(lprog,'u_view'),
      lu_show=gl.getUniformLocation(lprog,'u_show[0]'),lu_alpha=gl.getUniformLocation(lprog,'u_alpha');
const MAX_TEX=gl.getParameter(gl.MAX_TEXTURE_SIZE);
function mkTex(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
const tex=mkTex(),shTex=mkTex(),coefTex=mkTex();
gl.bindTexture(gl.TEXTURE_2D,shTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,1,1,0,gl.RGBA,gl.FLOAT,new Float32Array(4));
let shHas=false,shBands=15,shCols=1;
function uploadSH(cb){
  if(!cb){shHas=false;return;}
  const K=cb.length/45|0,maxRows=Math.max(1,(MAX_TEX/2)|0);
  shCols=Math.max(1,Math.ceil(K/maxRows));while(shCols*15>MAX_TEX)shCols--;
  const rows=Math.ceil(K/shCols),W=shCols*15,data=new Float32Array(W*rows*4);
  for(let e=0;e<K;e++){const col=e%shCols,row=(e/shCols)|0,ob=e*45,rb=(row*W+col*15)*4;
    for(let k=0;k<15;k++){const o=rb+k*4,c=ob+k*3;data[o]=cb[c];data[o+1]=cb[c+1];data[o+2]=cb[c+2];}}
  gl.bindTexture(gl.TEXTURE_2D,shTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,W,rows,0,gl.RGBA,gl.FLOAT,data);shHas=true;}

const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-2,-2,2,-2,2,2,-2,2]),gl.STATIC_DRAW);
const a_pos=gl.getAttribLocation(prog,'a_pos');gl.enableVertexAttribArray(a_pos);gl.vertexAttribPointer(a_pos,2,gl.FLOAT,false,0,0);
const a_index=gl.getAttribLocation(prog,'a_index'),ib=gl.createBuffer();
gl.enableVertexAttribArray(a_index);gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.vertexAttribIPointer(a_index,1,gl.UNSIGNED_INT,0,0);gl.vertexAttribDivisor(a_index,1);
gl.bindVertexArray(null);
// Cast lines get their own VAO: a different program means different attribute locations, and the
// buffer is interleaved (pos, colour, end, plane) = 8 floats per vertex, written once at load.
const lvao=gl.createVertexArray();gl.bindVertexArray(lvao);
const lbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,lbuf);
[['a_p',3,0],['a_col',3,12],['a_end',1,24],['a_plane',1,28]].forEach(([n,sz,off])=>{
  const l=gl.getAttribLocation(lprog,n);gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l,sz,gl.FLOAT,false,32,off);});
gl.bindVertexArray(null);
gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE_MINUS_DST_ALPHA,gl.ONE,gl.ONE_MINUS_DST_ALPHA,gl.ONE);gl.blendEquation(gl.FUNC_ADD);

// ===== splat packing =====
const _f=new Float32Array(1),_i=new Int32Array(_f.buffer);
function toHalf(v){_f[0]=v;const x=_i[0];let b=(x>>16)&0x8000,m=(x>>12)&0x07ff,e=(x>>23)&0xff;if(e<103)return b;if(e>142){b|=0x7c00;b|=((e==255)?0:1)&&(x&0x007fffff);return b;}if(e<113){m|=0x0800;b|=(m>>(114-e))+((m>>(113-e))&1);return b;}b|=((e-112)<<10)|(m>>1);b+=m&1;return b;}
function packHalf2(a,b){return (toHalf(a)|(toHalf(b)<<16))>>>0;}
function quatRotMat(w,x,y,z){return[1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y),2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x),2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)];}
let N=0,texW=0,texH=0,texU32=null,texF32=null,depthIndex=null,needSort=true,planeStart=0,castMax=0;
function writeSplat(i,cx,cy,cz,q,sx,sy,sz,rgba,tag){const o=8*i;texF32[o]=cx;texF32[o+1]=cy;texF32[o+2]=cz;
 const R=quatRotMat(q[0],q[1],q[2],q[3]);
 const M=[R[0]*sx,R[1]*sy,R[2]*sz,R[3]*sx,R[4]*sy,R[5]*sz,R[6]*sx,R[7]*sy,R[8]*sz];
 const s0=M[0]*M[0]+M[1]*M[1]+M[2]*M[2],s1=M[0]*M[3]+M[1]*M[4]+M[2]*M[5],s2=M[0]*M[6]+M[1]*M[7]+M[2]*M[8];
 const s3=M[3]*M[3]+M[4]*M[4]+M[5]*M[5],s4=M[3]*M[6]+M[4]*M[7]+M[5]*M[8],s5=M[6]*M[6]+M[7]*M[7]+M[8]*M[8];
 texU32[o+3]=tag>>>0;
 texU32[o+4]=packHalf2(4*s0,4*s1);texU32[o+5]=packHalf2(4*s2,4*s3);texU32[o+6]=packHalf2(4*s4,4*s5);texU32[o+7]=rgba>>>0;}
const counts=new Uint32Array(65536);
function sortSplats(view){if(!depthIndex||depthIndex.length!==N)depthIndex=new Uint32Array(N);
 const v2=view[2],v6=view[6],v10=view[10],v14=view[14],d=new Int32Array(N),P=texF32;
 let dlo=Infinity,dhi=-Infinity;
 for(let i=0;i<N;i++){const o=8*i,z=(v2*P[o]+v6*P[o+1]+v10*P[o+2]+v14)*4096|0;d[i]=z;if(z<dlo)dlo=z;if(z>dhi)dhi=z;}
 const sc=65535/((dhi-dlo)||1);counts.fill(0);
 for(let i=0;i<N;i++){let b=(d[i]-dlo)*sc|0;b=b<0?0:b>65535?65535:b;d[i]=b;counts[b]++;}
 const st=new Uint32Array(65536);for(let i=1;i<65536;i++)st[i]=st[i-1]+counts[i-1];
 for(let i=0;i<N;i++)depthIndex[st[d[i]]++]=i;
 gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferData(gl.ARRAY_BUFFER,depthIndex,gl.DYNAMIC_DRAW);}

// ===== orbit camera (world Z up) =====
// Orbit rather than fly, as points.html argues: one object on a turntable needs orbit/pan/dolly,
// and that vocabulary is fully reachable by touch. The renderer's basis convention is viewer.html's
// — r/u/f as the view matrix's columns, with u pointing DOWN the screen (the projection flips Y) —
// so the basis is built directly rather than through a quaternion.
const UP=[0,0,1];      // canonical D-NeRF frame: the floor is the xy plane, z is vertical
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};
const _e=parseFloat(Q.get('elev')),CAM_ELEV=(Number.isFinite(_e)?_e:18)*Math.PI/180;
// pull back so the sheets fit: they sit on the field's aabb, which is wider than the cloud the
// dataset camera was framed for
const _z=parseFloat(Q.get('zoom')),CAM_ZOOM=Number.isFinite(_z)?_z:1.42;
const cam={yaw:0,pitch:.4,dist:6,target:[0,0,0]};
let home={yaw:0,pitch:.4,dist:6,target:[0,0,0]},camMeta=null,camPos=[0,0,0];
function camBasis(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  const eye=[cam.target[0]+cam.dist*cp*sy,cam.target[1]+cam.dist*cp*cy,cam.target[2]+cam.dist*sp];
  const f=norm([cam.target[0]-eye[0],cam.target[1]-eye[1],cam.target[2]-eye[2]]);
  // u is screen-DOWN, i.e. world up orthogonalised against f and negated
  const u=norm([-(UP[0]-f[0]*dot(UP,f)),-(UP[1]-f[1]*dot(UP,f)),-(UP[2]-f[2]*dot(UP,f))]);
  return {eye,f,u,r:cross(u,f)};                 // cross(r,u)=f — same handedness as viewer.html
}
function viewMatrix(){const{eye,f,r,u}=camBasis();camPos=eye;
  return[r[0],u[0],f[0],0, r[1],u[1],f[1],0, r[2],u[2],f[2],0,
         -dot(r,eye),-dot(u,eye),-dot(f,eye),1];}
function projMatrix(w,h,fx,fy){const zn=Math.min(0.5,Math.max(0.02,cam.dist*0.02)),zf=cam.dist*20+100;
  return[2*fx/w,0,0,0, 0,-2*fy/h,0,0, 0,0,zf/(zf-zn),1, 0,0,-(zf*zn)/(zf-zn),0];}
function frameScene(){
  // Opening pose from the dataset's held-out test camera, converted into orbit state: the D-NeRF
  // cameras aim at the origin, so the target is the origin and the pose is (yaw, pitch, dist).
  // CAM_ELEV then raises the viewpoint about that target — the orbit form of what viewer.html does
  // by rotating the camera about its own right axis.
  if(camMeta){
    const e=camMeta.campos.map(v=>v*CAM_ZOOM),d=Math.hypot(e[0],e[1],e[2])||1;
    cam.dist=d;cam.pitch=Math.max(-1.45,Math.min(1.45,Math.asin(e[2]/d)+CAM_ELEV));
    cam.yaw=Math.atan2(e[0],e[1]);
  }
  cam.target=[0,0,0];
  home={yaw:cam.yaw,pitch:cam.pitch,dist:cam.dist,target:[0,0,0]};
  needSort=true;
}
// Pointer events, one code path for mouse and touch: one pointer orbits (shift or right button
// pans), two pinch to dolly and drag to pan. The pitch clamp keeps the view off the poles, where
// the up-vector orthogonalisation degenerates.
const ptrs=new Map();let mode=null,lastX=0,lastY=0,pinch0=0,dist0=0;
const mid=()=>{const v=[...ptrs.values()];return[(v[0].x+v[1].x)/2,(v[0].y+v[1].y)/2];};
const spread=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1;};
function panBy(dx,dy){const{r,u}=camBasis(),s=cam.dist*0.0015;
  for(let c=0;c<3;c++)cam.target[c]+=-r[c]*dx*s-u[c]*dy*s;}     // u is screen-down, hence -u
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){mode=(e.shiftKey||e.button===2)?'pan':'orbit';lastX=e.clientX;lastY=e.clientY;}
  else if(ptrs.size===2){mode='pinch';pinch0=spread();dist0=cam.dist;[lastX,lastY]=mid();}
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==='pinch'&&ptrs.size>=2){
    cam.dist=Math.max(1e-3,dist0*pinch0/spread());
    const[mx,my]=mid();panBy(mx-lastX,my-lastY);lastX=mx;lastY=my;return;}
  if(ptrs.size!==1)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  if(mode==='pan')panBy(dx,dy);
  else{cam.yaw+=dx*0.006;cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch-dy*0.006));}
});
const drop=e=>{ptrs.delete(e.pointerId);
  if(ptrs.size===1){mode='orbit';const v=[...ptrs.values()][0];lastX=v.x;lastY=v.y;}
  else if(!ptrs.size)mode=null;};
canvas.addEventListener('pointerup',drop);canvas.addEventListener('pointercancel',drop);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=Math.exp(e.deltaY*0.001);},{passive:false});
function resize(){const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(canvas.clientWidth*dpr));canvas.height=Math.max(1,Math.floor(canvas.clientHeight*dpr));}
addEventListener('resize',resize);

// ===== state =====
const S={t:0,frames:1,show:new Float32Array([1,1,1]),sheetAlpha:.85,cloud:1,
         hard:false,hardR:1,cast:false,castN:400,
         meta:null,coef:null,fps:0,fpsN:0,fpsT:0,counts:'',started:false};
let lastView=null;

// ===== load =====
async function boot(){
  stage('loading canonical gaussians…',5);
  const {parseNpz,buildKeyframe}=await import('../smv/decode.js');
  const base=SCENE.replace(/[^/]*$/,'');
  const scene=await (await fetch(SCENE)).json();
  const kf=buildKeyframe(parseNpz(new Uint8Array(
    await (await fetch(base+scene.gops[0].reference_path)).arrayBuffer())),null,0);
  camMeta=scene.camera||null;

  stage('loading tri-planes…',45);
  const meta=await (await fetch(TRI+'meta.json')).json();
  S.meta=meta;S.frames=meta.num_frames||meta.capacity;
  const {h,w}=meta.levels[0],NT=meta.rank+1;

  // Only the `composed` coefficient atlas is fetched — the motion basis and the Gram the exporter
  // also writes belong to triplanes.html. One 896×384 RGBA32F texture, laid out tiles-across ×
  // planes-down, dequantised here so the shader needs no per-tile min/range uniforms.
  const img=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);
    i.onerror=()=>rej(new Error('could not load '+u));i.src=u;});
  const px=async(url,tw,th)=>{const c=document.createElement('canvas');c.width=tw;c.height=th;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(await img(url),0,0);
    return x.getImageData(0,0,tw,th).data;};
  S.coef=new Float32Array(NT*w*meta.planes.length*h*4);
  for(let p=0;p<meta.planes.length;p++){
    const lv=meta.bases[BASIS].planes[meta.planes[p]][0],d=await px(TRI+lv.file,NT*w,h);
    for(let i=0;i<NT;i++)for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const s=(y*NT*w+i*w+x)*4,o=(((p*h+y)*NT*w)+(i*w+x))*4;
      for(let c=0;c<3;c++)S.coef[o+c]=d[s+c]/255*lv.tiles[i].range[c]+lv.tiles[i].min[c];}
    stage('loading tri-planes…',45+15*(p+1)/meta.planes.length);
  }
  const occ={};
  for(const p of meta.planes){
    const d=await px(TRI+meta.occupancy.files[p+'_l'+meta.levels[0].level],w,h),f=new Float32Array(w*h);
    for(let i=0;i<f.length;i++)f[i]=d[i*4]/255;
    occ[p]=f;
  }

  stage('building the scene…',85);
  const nCells=buildScene(kf,meta,occ);
  buildCast(kf,meta);
  uploadAtlas();uploadSH(kf.shCodebook);
  frameScene();resize();
  loadEl.classList.add('hide');hudEl.classList.add('on');
  S.started=true;requestAnimationFrame(frame);
  // castMax: how many gaussians actually sit inside the field's box and are opaque enough to cast.
  // The host clamps its Lines slider to it so the top of the range cannot silently do nothing.
  post({type:'ready',frames:S.frames,splats:N,castMax,
        note:kf.numTotal.toLocaleString()+' canonical gaussians + '+nCells.toLocaleString()
             +' tri-plane cells, all one sorted splat pass'});
  post({type:'buffered',end:S.frames});
}

// Sheet placement: each plane sits on a face of the field's OWN aabb, the box its cells are
// addressed in, so a cell's world position is exactly where the field samples it. xy goes to the
// low z face and the other two to their high faces, as the original render_gs.py figure did.
const FACE={xy:[2,0],xz:[1,1],yz:[0,1]};              // [normal axis, 0 = min face, 1 = max face]
const AX={xy:[0,1],xz:[0,2],yz:[1,2]};
function buildScene(kf,meta,occ){
  const {h,w}=meta.levels[0],lo=meta.aabb_min,hi=meta.aabb_max,TH=meta.occupancy.threshold;
  const cell=[(hi[0]-lo[0])/(w-1),(hi[1]-lo[1])/(h-1),(hi[2]-lo[2])/(h-1)];
  const cells=[];
  meta.planes.forEach((p,pi)=>{
    const o=occ[p];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const a=o[y*w+x];if(a>TH)cells.push([pi,x,y,a]);}
  });
  const NC=kf.numTotal;
  planeStart=NC;N=NC+cells.length;
  texW=2048;texH=Math.ceil(N/1024);texU32=new Uint32Array(texW*texH*4);texF32=new Float32Array(texU32.buffer);
  for(let i=0;i<NC;i++)writeSplat(i,kf.center[3*i],kf.center[3*i+1],kf.center[3*i+2],
    kf.quat.subarray(4*i,4*i+4),kf.scale[3*i],kf.scale[3*i+1],kf.scale[3*i+2],
    kf.color[i],kf.shIndex?kf.shIndex[i]:0);
  cells.forEach((c,j)=>{
    const [pi,x,y,a]=c,p=meta.planes[pi],[ax,ay]=AX[p],[nax,side]=FACE[p];
    const pos=[0,0,0];
    pos[ax]=lo[ax]+(hi[ax]-lo[ax])*(x/(w-1));
    pos[ay]=lo[ay]+(hi[ay]-lo[ay])*(y/(h-1));
    pos[nax]=side?hi[nax]:lo[nax];
    // in-plane σ a little over half a cell so neighbours just overlap; flat along the normal
    const sc=[0,0,0];sc[ax]=cell[ax]*0.62;sc[ay]=cell[ay]*0.62;sc[nax]=cell[ax]*0.02;
    writeSplat(NC+j,pos[0],pos[1],pos[2],[1,0,0,0],sc[0],sc[1],sc[2],
      (Math.round(Math.min(1,a)*255)<<24)>>>0,(pi<<28)|(x<<14)|y);
  });
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32UI,texW,texH,0,gl.RGBA_INTEGER,gl.UNSIGNED_INT,texU32);
  S.counts=NC.toLocaleString()+' canonical + '+cells.length.toLocaleString()+' sheet cells';
  return cells.length;
}
// One segment per sampled gaussian per plane, built once. The count slider then draws a PREFIX of
// this buffer rather than rebuilding it — which only works because the sample order is shuffled
// first, so any prefix is a spatially even sample of the cloud rather than whatever order the
// exporter happened to write. Shuffled deterministically (a fixed-seed LCG) so the same gaussians
// are picked on every load and the figure does not reshuffle under you.
const CAST_MAX=3000;                 // ~9k segments; past this the overlay is a hairball, not a figure
function buildCast(kf,meta){
  const lo=meta.aabb_min,hi=meta.aabb_max,C=kf.center,COL=kf.color;
  const ok=[];
  for(let i=0;i<kf.numTotal;i++){
    const x=C[3*i],y=C[3*i+1],z=C[3*i+2];
    // Outside the field's own box there is no foot of a perpendicular ON the sheet, and clamping
    // one onto it would draw a lookup that never happens. A near-transparent floater is skipped for
    // the same reason it contributes nothing to the render.
    if(x<lo[0]||x>hi[0]||y<lo[1]||y>hi[1]||z<lo[2]||z>hi[2])continue;
    if((COL[i]>>>24)<26)continue;
    ok.push(i);
  }
  let s=0x9e3779b9>>>0;const rnd=()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296);
  for(let i=ok.length-1;i>0;i--){const j=(rnd()*(i+1))|0,t=ok[i];ok[i]=ok[j];ok[j]=t;}
  castMax=Math.min(ok.length,CAST_MAX);
  const V=new Float32Array(castMax*meta.planes.length*2*8);let o=0;
  for(let k=0;k<castMax;k++){
    const i=ok[k],x=C[3*i],y=C[3*i+1],z=C[3*i+2],c=COL[i];
    const r=(c&0xff)/255,g=((c>>>8)&0xff)/255,b=((c>>>16)&0xff)/255;
    meta.planes.forEach((p,pi)=>{
      const [nax,side]=FACE[p],f=[x,y,z];f[nax]=side?hi[nax]:lo[nax];
      V[o]=x;V[o+1]=y;V[o+2]=z;   V[o+3]=r;V[o+4]=g;V[o+5]=b;V[o+6]=0;V[o+7]=pi;o+=8;
      V[o]=f[0];V[o+1]=f[1];V[o+2]=f[2];V[o+3]=r;V[o+4]=g;V[o+5]=b;V[o+6]=1;V[o+7]=pi;o+=8;
    });
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,lbuf);gl.bufferData(gl.ARRAY_BUFFER,V,gl.STATIC_DRAW);
  return castMax;
}
function uploadAtlas(){
  const {h,w}=S.meta.levels[0],NT=S.meta.rank+1,W=NT*w,H=S.meta.planes.length*h;
  gl.bindTexture(gl.TEXTURE_2D,coefTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,W,H,0,gl.RGBA,gl.FLOAT,S.coef);
}

// ===== per-frame =====
// Same lerp DirectGrid4D._resolve_temporal_w applies between knots. NOTE this is the grid's own
// continuous-time path, not what the trained renderer does there: inference reads the field at both
// bracketing knots and cubic-Hermite interpolates the predicted offsets (the v_* heads).
function weightsAt(t){
  const K=S.meta.capacity,TW=S.meta.temporal_weights;
  const x=Math.min(Math.max(t,0),1)*(K-1),li=Math.min(Math.floor(x),K-2),f=x-li;
  const w=new Float32Array(S.meta.rank);
  for(let r=0;r<w.length;r++)w[r]=TW[li][r]*(1-f)+TW[li+1][r]*f;
  return w;
}
function setStaticUniforms(){
  const m=S.meta,lv=m.levels[0];
  gl.uniform1ui(u_planeStartL,planeStart);
  gl.uniform2i(u_resL,lv.w,lv.h);
  // One window per plane, fixed for the whole sequence: the same colour has to mean the same
  // feature value at every t, or the sheets would be re-levelled under you as you scrub.
  const lo=new Float32Array(9),hi=new Float32Array(9);
  m.planes.forEach((p,i)=>{
    const b=m.bases[BASIS].planes[p][0];
    for(let c=0;c<3;c++){lo[i*3+c]=b.p1[c];hi[i*3+c]=Math.max(b.p99[c],b.p1[c]+1e-9);}
  });
  gl.uniform3fv(u_loL,lo);gl.uniform3fv(u_hiL,hi);
  gl.uniform1fv(u_showL,S.show);
  gl.uniform1f(u_sheetAlphaL,S.sheetAlpha);gl.uniform1f(u_cloudAlphaL,S.cloud);
  gl.uniform1i(u_hardL,S.hard?1:0);gl.uniform1f(u_hardRL,S.hardR);
}
// Overlay, drawn after the splats with the ordinary source-alpha blend and then handing the
// front-to-back `under` operator back — the same two-line dance drawTraj() does in viewer.html.
function drawCast(proj,view){
  const n=Math.min(S.castN,castMax);if(!n)return;
  gl.useProgram(lprog);gl.bindVertexArray(lvao);
  gl.uniformMatrix4fv(lu_proj,false,proj);gl.uniformMatrix4fv(lu_view,false,view);
  gl.uniform1fv(lu_show,S.show);gl.uniform1f(lu_alpha,0.55);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.drawArrays(gl.LINES,0,n*S.meta.planes.length*2);
  gl.blendFuncSeparate(gl.ONE_MINUS_DST_ALPHA,gl.ONE,gl.ONE_MINUS_DST_ALPHA,gl.ONE);
  gl.bindVertexArray(null);
}
function frame(t){
  requestAnimationFrame(frame);
  if(!S.started||!N)return;
  S.fpsN++;if(t-S.fpsT>1000){S.fps=Math.round(S.fpsN*1000/(t-S.fpsT));S.fpsN=0;S.fpsT=t;
    post({type:'stats',fps:S.fps,splats:N});
    hudEl.textContent=S.counts+'  ·  '+S.fps+' fps';}
  const vw=canvas.width,vh=canvas.height;
  const fov=camMeta?Math.max(camMeta.fovx,camMeta.fovy):1.1;
  const fx=0.5*Math.min(vw,vh)/Math.tan(fov/2),fy=fx;
  const view=viewMatrix();
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.viewport(0,0,vw,vh);
  // Orbiting is a pointer handler, so it cannot set needSort itself without firing on every move;
  // the view matrix is the honest test of whether the depth order can still be valid.
  let moved=!lastView;if(lastView)for(let i=0;i<16;i++)if(Math.abs(view[i]-lastView[i])>1e-6)moved=true;
  lastView=view.slice();
  if(moved||needSort){sortSplats(view);needSort=false;}
  gl.useProgram(prog);gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(u_texL,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,shTex);gl.uniform1i(u_shL,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,coefTex);gl.uniform1i(u_coefL,2);
  gl.uniform1i(u_hasSHL,shHas?1:0);gl.uniform1i(u_shColsL,shCols);gl.uniform1i(u_shBandsL,shBands);
  gl.uniform3fv(u_camposL,camPos);
  const proj=projMatrix(vw,vh,fx,fy);
  gl.uniformMatrix4fv(u_proj,false,proj);gl.uniformMatrix4fv(u_view,false,view);
  gl.uniform2f(u_focal,fx,fy);gl.uniform2f(u_viewport,vw,vh);gl.uniform1f(u_op,1.0);
  // screen-space low-pass scaled to the training resolution, as in the SMV viewer — without the
  // scale a canvas wider than the dataset camera renders every splat a fraction of a pixel wide
  const k=camMeta?vw/camMeta.width:1;gl.uniform1f(u_lowpassL,1.2*k*k);
  setStaticUniforms();
  gl.uniform1fv(u_wL,weightsAt(S.t));      // the whole time axis, in six floats
  gl.drawArraysInstanced(gl.TRIANGLE_FAN,0,4,N);
  gl.bindVertexArray(null);
  if(S.cast)drawCast(proj,view);
}

// ===== host messages =====
// Announce until the host answers: this module could run before the host page has attached its
// listener, and a single dropped hello would strand the panel.
let _hello=0;
function hello(){post({type:'hello',scene:SCENE});_hello=setTimeout(hello,600);}
addEventListener('message',e=>{
  if(e.origin!==location.origin)return;const m=e.data;
  if(!m||m.ch!=='spdef'||m.to!==ID)return;
  // `view` and `seek` are what flush()/setFrame send, i.e. the only messages the host emits once it
  // has actually registered this panel — a broadcast `stage` can reach a frame it never heard from.
  if(m.type==='view'||m.type==='seek')clearTimeout(_hello);
  if(m.type==='seek'){S.t=S.frames>1?Math.min(Math.max(m.frame/(S.frames-1),0),1):0;}
  else if(m.type==='resetView'){cam.yaw=home.yaw;cam.pitch=home.pitch;cam.dist=home.dist;
    cam.target=home.target.slice();}
  else if(m.type==='view'){
    // The host sends the whole option set every time, so this stays idempotent.
    if(m.sheets)for(let i=0;i<3;i++)S.show[i]=m.sheets[i]?1:0;
    if(m.sheetAlpha!=null)S.sheetAlpha=m.sheetAlpha;
    if(m.cloud!=null)S.cloud=m.cloud?1:0;
    if(m.ellip!=null)S.hard=!!m.ellip;
    if(m.ellipR!=null)S.hardR=m.ellipR;
    if(m.cast!=null)S.cast=!!m.cast;
    if(m.castCount!=null)S.castN=m.castCount;}
  else if(m.type==='error')showErr(m.msg);
});

if(HOST)hello();
boot().then(()=>{
  // Standalone (the same fallback viewer.html and points.html keep): run the clock here so the
  // panel stays debuggable on its own. Hosted, the host owns the clock and this never starts.
  if(HOST)return;
  let t0=null;const FPS=30;
  requestAnimationFrame(function play(t){requestAnimationFrame(play);
    if(t0===null){t0=t;return;}
    S.t=(S.t+(t-t0)/1000*FPS/Math.max(1,S.frames-1))%1;t0=t;});
}).catch(e=>{console.error(e);showErr(e.message||e);});
</script>
